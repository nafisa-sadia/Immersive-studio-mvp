<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immersive Studio MVP</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f1e8;color:#171717}
.wrap{max-width:900px;margin:0 auto;padding:40px 20px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{font-size:34px;margin:0 0 8px}
h2{margin-top:0}
p{line-height:1.5}
.step{display:none}.step.active{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}
button,.choice{border:0;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer}
.choice{background:#ece8dc;text-align:left}
.choice:hover,.choice.selected{background:#d8f09b}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.primary{background:#161616;color:#fff}.secondary{background:#ddd}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #bbb;margin:8px 0 16px}
.progress{display:flex;gap:8px;margin-bottom:24px}
.dot{height:8px;flex:1;background:#ddd;border-radius:10px}.dot.on{background:#161616}
.summary{background:#f5f0ff;padding:18px;border-radius:12px}
.tag{display:inline-block;background:#d8f09b;padding:6px 10px;border-radius:20px;margin:4px 6px 4px 0}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="progress"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<section class="step active">
<h1>Turn your space into an experience.</h1>
<p>Plan a custom immersive installation in a few quick steps.</p>
<div class="choices" data-key="service">
<button class="choice">Museum / Exhibition</button>
<button class="choice">Brand Activation</button>
<button class="choice">Education</button>
<button class="choice">Event / Pop-up</button>
</div>
<div class="actions"><span></span><button class="primary" onclick="nextStep()">Start</button></div>
</section>

<section class="step">
<h2>Tell us about your project</h2>
<label>Project goal</label>
<textarea id="goal" placeholder="What should visitors feel, learn, or do?"></textarea>
<label>Venue / space</label>
<input id="space" placeholder="Gallery, classroom, event hall...">
<label>Audience</label>
<input id="audience" placeholder="Families, students, customers...">
<div class="actions"><button class="secondary" onclick="backStep()">Back</button><button class="primary" onclick="nextStep()">Continue</button></div>
</section>

<section class="step">
<h2>Choose a budget range</h2>
<div class="choices" data-key="budget">
<button class="choice">$2K–$5K</button>
<button class="choice">$5K–$15K</button>
<button class="choice">$15K–$30K</button>
<button class="choice">$30K+</button>
</div>
<div class="actions"><button class="secondary" onclick="backStep()">Back</button><button class="primary" onclick="nextStep()">Continue</button></div>
</section>

<section class="step">
<h2>Preferred experience elements</h2>
<div class="choices multi" data-key="tech">
<button class="choice">Projection</button>
<button class="choice">Sound</button>
<button class="choice">Lighting</button>
<button class="choice">Sensors</button>
<button class="choice">AR / VR</button>
<button class="choice">Interactive Screens</button>
</div>
<div class="actions"><button class="secondary" onclick="backStep()">Back</button><button class="primary" onclick="nextStep()">View concept</button></div>
</section>

<section class="step">
<h2>Your concept</h2>
<div class="summary" id="summary"></div>
<p><strong>Next step:</strong> Book a consultation to refine the concept, scope, and production plan.</p>
<label>Email</label>
<input placeholder="name@example.com">
<div class="actions"><button class="secondary" onclick="backStep()">Back</button><button class="primary" onclick="alert('Consultation request submitted!')">Request consultation</button></div>
</section>
</div></div>

<script>
let current=0;
const steps=[...document.querySelectorAll('.step')];
const dots=[...document.querySelectorAll('.dot')];
const data={service:'',budget:'',tech:[]};

document.querySelectorAll('.choices').forEach(group=>{
  group.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=group.dataset.key;
      if(group.classList.contains('multi')){
        btn.classList.toggle('selected');
        data[key]=[...group.querySelectorAll('.selected')].map(x=>x.textContent);
      } else {
        group.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        data[key]=btn.textContent;
      }
    });
  });
});

function render(){
  steps.forEach((s,i)=>s.classList.toggle('active',i===current));
  dots.forEach((d,i)=>d.classList.toggle('on',i<=current));
  if(current===4){
    const goal=document.getElementById('goal').value || 'Create a memorable visitor experience';
    const space=document.getElementById('space').value || 'Client venue';
    const audience=document.getElementById('audience').value || 'Visitors';
    const tech=(data.tech.length?data.tech:['Projection','Sound']).map(t=>`<span class="tag">${t}</span>`).join('');
    document.getElementById('summary').innerHTML=
      `<p><strong>Experience:</strong> ${data.service || 'Immersive installation'}</p>
       <p><strong>Goal:</strong> ${goal}</p>
       <p><strong>Space:</strong> ${space}</p>
       <p><strong>Audience:</strong> ${audience}</p>
       <p><strong>Budget:</strong> ${data.budget || 'To discuss'}</p>
       <p><strong>Suggested elements:</strong><br>${tech}</p>`;
  }
}
function nextStep(){if(current<steps.length-1){current++;render();}}
function backStep(){if(current>0){current--;render();}}
</script>
</body>
</html>
